
name: Build FreeCut Studio APK

on:
  workflow_dispatch:
    push:
        paths:
              - "FreeCut_Studio_Clean_Starter.zip"
                    - ".github/workflows/build-apk.yml"

                    permissions:
                      contents: read

                      jobs:
                        build:
                            runs-on: ubuntu-latest
                                steps:
                                      - name: Get project files
                                              uses: actions/checkout@v4

                                                    - name: Set up Java
                                                            uses: actions/setup-java@v4
                                                                    with:
                                                                              distribution: temurin
                                                                                        java-version: "17"

                                                                                              - name: Set up Flutter
                                                                                                      uses: subosito/flutter-action@v2
                                                                                                              with:
                                                                                                                        channel: stable

                                                                                                                              - name: Extract project
                                                                                                                                      run: |
                                                                                                                                                mkdir project
                                                                                                                                                          unzip -q FreeCut_Studio_Clean_Starter.zip -d project

                                                                                                                                                                - name: Generate Android files
                                                                                                                                                                        working-directory: project
                                                                                                                                                                                run: flutter create --platforms=android --project-name freecut_studio --org com.freecutstudio .

                                                                                                                                                                                      - name: Install packages
                                                                                                                                                                                              working-directory: project
                                                                                                                                                                                                      run: flutter pub get

                                                                                                                                                                                                            - name: Build APK
                                                                                                                                                                                                                    working-directory: project
                                                                                                                                                                                                                            run: flutter build apk --release

                                                                                                                                                                                                                                  - name: Upload APK
                                                                                                                                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                            name: FreeCut-Studio-APK
                                                                                                                                                                                                                                                                      path: project/build/app/outputs/flutter-apk/app-release.apk